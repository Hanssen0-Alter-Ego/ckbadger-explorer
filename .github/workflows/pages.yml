name: Deploy Explorer to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: corepack pnpm@9.15.0 install --frozen-lockfile
      - name: Test routing and reviewed accessibility regressions
        run: >-
          corepack pnpm@9.15.0 --dir frontend exec vitest run --maxWorkers=2 --minWorkers=1
          __tests__/lib/pages-hosting.test.ts __tests__/lib/active-network.test.ts
          __tests__/components/search-bar.test.tsx __tests__/components/command-palette.test.tsx
          __tests__/components/header.test.tsx __tests__/components/home-content.test.tsx
          __tests__/components/not-found-page.test.tsx __tests__/components/block-detail-error.test.tsx
          __tests__/components/site-footer.test.tsx __tests__/components/activities-stream-explorer.test.tsx
          __tests__/pages/inventory.test.tsx __tests__/pages/block-detail.test.tsx
          __tests__/components/mini-stats-cards.test.tsx __tests__/components/hex-display.test.tsx
          __tests__/lib/ordered-pipeline.test.ts __tests__/components/pipeline-preview.test.tsx
      - name: Build and verify Next.js export
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          corepack pnpm@9.15.0 --dir frontend build
          node frontend/scripts/verify-pages.mjs
      - name: Install Chromium for deterministic browser regression
        run: corepack pnpm@9.15.0 --dir frontend exec playwright install --with-deps chromium
      - name: Verify populated home scroll containment offline
        run: node frontend/scripts/verify-home-ci.cjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/site/out

  deploy:
    if: github.repository == 'Hanssen0-Alter-Ego/ckbadger-explorer'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
